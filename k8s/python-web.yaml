apiVersion: v1
kind: Namespace
metadata:
  name: python-web

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-app
  namespace: python-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-web-app
  template:
    metadata:
      labels:
        app: python-web-app
    spec:
      containers:
        - name: python-web-app
          image: 167341897161.dkr.ecr.us-east-1.amazonaws.com/python-web-application:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: python-web-service
  namespace: python-web
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: python-web-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000